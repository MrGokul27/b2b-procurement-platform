          >
            <img
              src="../assets/images/logoStackly.webp"
              alt="Stackly Enterprise Logo"
            />
          </a>

          <!-- Mobile Close Button -->
          <button
            type="button"
            class="sidebar-close-btn"
            id="sidebarCloseBtn"
            aria-label="Close Sidebar"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Role Badge & Active User Org Information -->
        <div class="sidebar-role-badge-box" id="sidebarRoleBox">
          <!-- Dynamic Role info rendered via dashboard.js -->
        </div>

        <!-- Dynamic Navigation Links Section -->
        <div class="sidebar-nav-container">
          <div class="sidebar-nav-section-title">Role Modules</div>
          <ul class="sidebar-nav-list" id="sidebarNavList">

          </ul>
        </div>

        <!-- Sidebar Footer Actions -->
        <div class="sidebar-footer">

              <span>Sign Out</span>

          </div>
        </div>

            <!-- Notifications Icon Button -->

              type="button"

            <div class="topbar-user-profile">

              <div class="topbar-user-meta">
